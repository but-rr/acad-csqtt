name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The tag must match VERSION, for example 1.1.0 -> v1.1.0'
          }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-go@v7
        with:
          go-version-file: packet-proxy/go.mod
          cache-dependency-path: packet-proxy/go.sum

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust-client/target
          key: windows-2022-rust-${{ hashFiles('rust-toolchain.toml', 'core/rust-client/Cargo.lock', 'core/rust-client/Cargo.toml', 'core/rust-client/vendor/**') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-rust-${{ hashFiles('rust-toolchain.toml', 'core/rust-client/Cargo.lock', 'core/rust-client/Cargo.toml', 'core/rust-client/vendor/**') }}-

      - name: Install packager
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build ZIP and check startup
        run: ./build.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "CSQTT-$tag-Win10-x64.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive "$archive.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $archive "$archive.sha256" --verify-tag --title "CSQTT $tag" --notes-file RELEASE_NOTES.md --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --draft=false --latest --title "CSQTT $tag" --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
